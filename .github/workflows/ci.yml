name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on main are never cancelled,
# so every commit on main keeps its own status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supply chain: fail on known high/critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
